<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Check-In · Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --parchment: #F8F0E3;
  --dark: #2C2820;
  --slate: #6B7B8D;
  --greige: #787362;
  --border: rgba(44,40,32,0.12);
  --border-strong: rgba(44,40,32,0.22);
  --success: #4A7C59;
  --success-bg: #EAF2ED;
  --warning-bg: #FDF6E3;
  --warning: #8A6800;
  --info-bg: #EDF2F7;
  --info: #2C5282;
  --stall-bg: #FBEAEA;
  --stall: #B23B3B;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(44,40,32,0.08), 0 4px 16px rgba(44,40,32,0.06);
}
body { font-family: 'DM Sans', sans-serif; background: var(--parchment); color: var(--dark); min-height: 100vh; font-size: 14px; line-height: 1.6; }
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; width: 320px; box-shadow: var(--shadow); }
.wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; letter-spacing: 0.04em; color: var(--dark); margin-bottom: 6px; }
.sub { font-size: 12px; color: var(--greige); margin-bottom: 28px; }
input[type=password] { width: 100%; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--dark); background: var(--parchment); margin-bottom: 12px; outline: none; }
input[type=password]:focus { border-color: var(--slate); }
.err { font-size: 12px; color: #c0392b; margin-bottom: 8px; display: none; }
.btn-primary { width: 100%; padding: 10px; background: var(--dark); color: var(--parchment); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-primary:hover { opacity: 0.85; }
#app { display: none; }
.topbar { background: white; border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 20px; letter-spacing: 0.04em; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.date-lbl { font-size: 13px; color: var(--greige); }
.refresh-btn { font-size: 12px; color: var(--slate); background: none; border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.refresh-btn:hover { background: var(--border); }
.main { max-width: 1440px; margin: 0 auto; padding: 32px 24px 80px; }
.section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
.section-title { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 20px; }
.section-count { font-size: 12px; color: var(--greige); }
.day-divider { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--greige); margin: 24px 0 10px; }
.card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 12px; box-shadow: var(--shadow); animation: fadeUp 0.3s ease both; }
.card.stalled { border-color: rgba(178,59,59,0.35); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.card-top .name-block { flex: 1; min-width: 0; }
.badge-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 14px 48px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; background: var(--info-bg); color: var(--info); }
.avatar.complete { background: var(--success-bg); color: var(--success); }
.avatar.waiting { background: var(--warning-bg); color: var(--warning); }
.avatar.tomorrow { background: var(--parchment); color: var(--greige); border: 1px solid var(--border-strong); }
.avatar.hold { background: var(--stall-bg); color: var(--stall); }
.cname { font-size: 15px; font-weight: 500; }
.cmeta { font-size: 12px; color: var(--greige); margin-top: 1px; }
.window-tag { font-size: 11px; color: var(--slate); margin-top: 2px; font-weight: 500; }
.badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.badge.ip { background: var(--info-bg); color: var(--info); }
.badge.wt { background: var(--warning-bg); color: var(--warning); }
.badge.done { background: var(--success-bg); color: var(--success); }
.badge.tmrw { background: var(--parchment); color: var(--greige); border: 1px solid var(--border-strong); }
.badge.hold { background: var(--stall-bg); color: var(--stall); }
.badge.stall { background: var(--stall-bg); color: var(--stall); }
.progress-row { display: flex; align-items: center; gap: 5px; margin-bottom: 14px; }
.pip { height: 5px; border-radius: 3px; background: var(--border); flex: 1; max-width: 32px; }
.pip.sent { background: var(--slate); opacity: 0.5; }
.pip.current { background: var(--slate); }
.pip-lbl { font-size: 12px; color: var(--greige); margin-left: 6px; white-space: nowrap; flex-shrink: 0; }
.activity-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.activity-lbl { font-size: 10px; letter-spacing: 0.08em; color: var(--greige); text-transform: uppercase; }
.reply-bubble { display: inline-block; background: var(--parchment); border: 1px solid var(--border-strong); border-radius: 10px 10px 2px 10px; padding: 4px 10px; font-size: 12px; }
.activity-time { font-size: 11px; color: var(--greige); }
.msg-preview { background: var(--parchment); border-left: 2px solid var(--slate); border-radius: 0 6px 6px 0; padding: 12px 14px; margin-bottom: 14px; }
.msg-lbl { font-size: 10px; letter-spacing: 0.08em; color: var(--greige); text-transform: uppercase; margin-bottom: 6px; }
.msg-text { font-size: 13px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.msg-text.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; max-height: 260px; overflow-y: auto; }
.msg-toggle { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--slate); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.schedule-note { font-size: 12px; color: var(--greige); }
.btn-feedback { padding: 8px 16px; background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,124,89,0.3); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.complete-section { margin-top: 20px; }
.complete-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 4px; font-size: 12px; color: var(--greige); user-select: none; }
.complete-toggle .chev { display: inline-block; transition: transform 0.15s ease; font-size: 10px; }
.complete-toggle.expanded .chev { transform: rotate(90deg); }
.complete-list { display: none; }
.complete-list.expanded { display: block; }
.complete-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: white; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
.complete-row .cname { font-size: 13px; font-weight: 500; }
.complete-row .cmeta { font-size: 11px; color: var(--greige); }
.complete-row .badge { margin-left: auto; }
.btn-feedback-sm { padding: 4px 10px; font-size: 11px; background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,124,89,0.3); border-radius: 6px; font-family: 'DM Sans', sans-serif; cursor: pointer; flex-shrink: 0; }
.admin-row { display: flex; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
.btn-hold { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: white; color: var(--dark); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-hold.active { background: var(--stall-bg); color: var(--stall); border-color: rgba(178,59,59,0.3); }
.btn-hold:disabled { opacity: 0.5; cursor: default; }
.btn-reply-toggle { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: white; color: var(--dark); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.reply-box { margin-top: 10px; }
.reply-input { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; resize: vertical; background: var(--parchment); color: var(--dark); }
.reply-actions { display: flex; gap: 8px; margin-top: 6px; }
.btn-reply-send { padding: 6px 14px; font-size: 12px; background: var(--dark); color: var(--parchment); border: none; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-reply-send:disabled { opacity: 0.4; cursor: default; }
.btn-reply-cancel { padding: 6px 14px; font-size: 12px; background: transparent; border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; color: var(--greige); font-family: 'DM Sans', sans-serif; }
/* Columns split the board's width evenly (flex: 1 1 0 gives every column
   equal share regardless of card count), so with the usual two columns
   -- Morning / Afternoon -- the divider between them lands dead center.
   On narrow viewports they stack instead of squeezing into slivers. */
.board { display: flex; gap: 0; padding: 2px 2px 12px; align-items: flex-start; }
.board-col { flex: 1 1 0; min-width: 0; padding-right: 24px; margin-right: 24px; border-right: 1px solid var(--border); }
.board-col:last-child { border-right: none; margin-right: 0; padding-right: 2px; }
@media (max-width: 720px) {
  .board { flex-direction: column; }
  .board-col { padding-right: 2px; margin-right: 0; margin-bottom: 24px; border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .board-col:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 2px; }
}
.board-col-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; gap: 8px; }
.board-col-title { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 16px; }
.board-col-sub { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--greige); margin-top: 2px; }
.board-col-count { font-size: 11px; color: var(--greige); flex-shrink: 0; padding-top: 3px; }
.board-col-empty { font-size: 12px; color: var(--greige); padding: 22px 12px; text-align: center; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.state-msg { text-align: center; padding: 60px 24px; color: var(--greige); }
.state-msg .ico { font-size: 32px; margin-bottom: 12px; }
.footer-note { text-align: center; font-size: 11px; color: var(--greige); margin-top: 40px; opacity: 0.7; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: var(--parchment); padding: 10px 20px; border-radius: 8px; font-size: 13px; transition: transform 0.25s ease; z-index: 999; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="wordmark">Self Check-In</div>
    <div class="sub">Dispatch · Operations</div>
    <input type="password" id="pw" placeholder="Password">
    <div class="err" id="pw-err">Incorrect password</div>
    <button class="btn-primary" id="login-btn">Enter</button>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-wordmark">Self Check-In</div>
    <div class="topbar-right">
      <span class="date-lbl" id="date-lbl"></span>
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    </div>
  </div>
  <div class="main">
    <div class="section-header">
      <span class="section-title">Today's experiences</span>
      <span class="section-count" id="exp-count"></span>
    </div>
    <div id="cards"></div>
    <div class="footer-note" id="footer-note"></div>
  </div>
</div>
<div id="toast"></div>
<script>
// NOTE: No Airtable token lives here. The client only ever talks to our own
// /api/experiences proxy, which holds the real Airtable token server-side
// (see api/experiences.js + Vercel Environment Variables).
//
// P3 note: this dashboard is a pure observation surface. P1 (inbound
// webhook) and P2 (scheduled sweep) own all sending and all Current Step
// advancement -- there is no button on this page that touches Current Step
// or message content. Do not add one back without updating P1/P2 too, or
// you risk desyncing Current Step from what Twilio actually sent.
//
// P4 exception (intentional, narrowly scoped): the Hold toggle and the
// reply box below DO write to Airtable -- that's the whole point of this
// ticket, the "human escape hatch." But neither one ever touches Current
// Step or the Message 1-15 fields. Hold toggle goes through api/hold.js,
// which writes Mode + resets Hold Notice Sent AND attempts to cancel any
// Twilio message P2's sweep already scheduled (Eve-Of/Morning Message SID)
// -- a plain field write alone wouldn't actually stop a queued message,
// since Twilio doesn't check Airtable at send time. The reply box sends a
// raw SMS via api/reply.js and stamps Last Manual Reply At (its own field,
// not Last Sent At) so the stall badge doesn't stay stuck on a conversation
// Amanda just handled herself. It used to write Last Sent At directly, but
// that collided with inbound.js's 60-second double-tap guard -- a manual
// reply would silently swallow a customer's next legitimate "next" text if
// it landed within 60s. Found via live P4 testing, fixed 2026-07-16.
var PASSWORD = 'selfcheckin2026'; // change this and DISPATCH_PASSWORD env var together if you want to rotate it
var STALL_MINUTES = 90;

// Check-In Date comes back from Airtable as a plain ISO date string
// (YYYY-MM-DD) because it's a real Date-type field now. Parsed as local
// time so "today"/"tomorrow" compares correctly regardless of viewer TZ.
function parseIsoDate(input) {
  if (!input) return null;
  if (Array.isArray(input)) input = input[0];
  var m = String(input).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function sameDay(d1, d2) {
  return !!d1 && !!d2 && d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}
// Message field names: steps 1-2 were renamed for clarity in P2
// (Message 1 (Eve-Of), Message 2 (Morn-Of)); steps 3-15 stay "Message N".
function messageField(i) {
  if (i === 1) return 'Message 1 (Eve-Of)';
  if (i === 2) return 'Message 2 (Morn-Of)';
  return 'Message ' + i;
}
function fmtTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function minutesSince(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return (Date.now() - d.getTime()) / 60000;
}
function computeTotalMsgs(f) {
  var totalMsgs = 0;
  for (var i = 1; i <= 15; i++) { if (f[messageField(i)]) totalMsgs = i; }
  return totalMsgs;
}
function isRecordComplete(f) {
  var status = f['Status'] || 'New';
  var step = f['Current Step'] != null ? f['Current Step'] : 0;
  var totalMsgs = computeTotalMsgs(f);
  return status === 'Complete' || (step >= totalMsgs && totalMsgs > 0);
}
function isRecordHold(f) {
  return (f['Mode'] || 'Auto') === 'Hold';
}
// "Activity" = the most recent of: an automated send (Last Sent At, written
// by inbound.js/sweep.js), a customer reply (Last Inbound At), or a manual
// reply Amanda sent from the dashboard (Last Manual Reply At, written by
// reply.js). Manual replies deliberately live in their own field rather than
// reusing Last Sent At -- see api/inbound.js's double-tap guard, which reads
// Last Sent At to ignore a customer's accidental double "next" within 60s of
// an automated send. If a manual reply also wrote that field, a legitimate
// "next" arriving within 60s of Amanda's reply would get silently swallowed
// the same way (found via live P4 testing, 2026-07-16).
function latestActivityIso(f) {
  var candidates = [f['Last Sent At'], f['Last Inbound At'], f['Last Manual Reply At']];
  var latest = '';
  for (var i = 0; i < candidates.length; i++) {
    var v = candidates[i] || '';
    if (v && (!latest || v > latest)) latest = v;
  }
  return latest;
}
// Stalled = mid-experience (already started, not finished, not just
// "tomorrow and not started yet"), and no activity in either direction for
// 90+ minutes.
function isRecordStalled(f, isTomorrow) {
  var step = f['Current Step'] != null ? f['Current Step'] : 0;
  var minsIdle = minutesSince(latestActivityIso(f));
  return !isTomorrow && !isRecordComplete(f) && !isRecordHold(f) && step > 0 && minsIdle !== null && minsIdle >= STALL_MINUTES;
}
// A "problem" card is anything that needs Amanda's eyes right now: paused
// on Hold, or gone quiet mid-experience past the stall threshold. These get
// sorted to the top of their column.
function hasProblem(f, isTomorrow) {
  return isRecordHold(f) || isRecordStalled(f, isTomorrow);
}

// Board columns, left to right. "Full Day" isn't sold yet -- the column is
// here on purpose, ready for whenever that option exists on the Customers
// "Check-In Time" field. Anything with a Check-In Time that doesn't match
// one of these keys (or no time set at all) falls into an Unscheduled
// column appended at the end, so we never silently drop a record.
// Full Day column is hidden until that offering actually ships -- no
// release date yet, no point showing an always-empty column in the
// meantime. To bring it back, uncomment the line below.
var COLUMN_DEFS = [
  { key: '9am-1pm', title: 'Morning', sub: '9am – 1pm · Half day', emptyMsg: 'None scheduled' },
  { key: '12pm-4pm', title: 'Afternoon', sub: '12pm – 4pm · Half day', emptyMsg: 'None scheduled' }
  // , { key: 'Full Day', title: 'Full Day', sub: 'Not offered yet', emptyMsg: 'Not offered yet' }
];
function getWindowKey(f) {
  var t = f['Check-In Time'];
  if (Array.isArray(t)) t = t[0];
  return t || null;
}
function windowTagText(key) {
  if (key === '9am-1pm') return 'Morning · Half day';
  if (key === '12pm-4pm') return 'Afternoon · Half day';
  if (key === 'Full Day') return 'Full day';
  return '';
}
function bySortPriority(isTomorrow) {
  var order = { 'In progress': 0, 'Ready': 1, 'New': 1, 'Curating': 2, 'Complete': 3 };
  return function(a, b) {
    var pa = hasProblem(a.fields, isTomorrow) ? 0 : 1;
    var pb = hasProblem(b.fields, isTomorrow) ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return (order[a.fields['Status']]||2)-(order[b.fields['Status']]||2);
  };
}
function buildBoard(recs, isTomorrow) {
  var buckets = {};
  COLUMN_DEFS.forEach(function(c) { buckets[c.key] = []; });
  var overflow = [];
  recs.forEach(function(r) {
    var key = getWindowKey(r.fields);
    if (key && buckets.hasOwnProperty(key)) buckets[key].push(r);
    else overflow.push(r);
  });
  var board = document.createElement('div');
  board.className = 'board';
  COLUMN_DEFS.forEach(function(col) {
    var list = buckets[col.key];
    list.sort(bySortPriority(isTomorrow));
    var colEl = document.createElement('div');
    colEl.className = 'board-col';
    colEl.innerHTML = '<div class="board-col-header"><div><div class="board-col-title">' + col.title + '</div><div class="board-col-sub">' + col.sub + '</div></div><span class="board-col-count">' + list.length + '</span></div>';
    if (list.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'board-col-empty';
      empty.textContent = col.emptyMsg;
      colEl.appendChild(empty);
    } else {
      list.forEach(function(rec, i) { colEl.appendChild(buildCard(rec, i, isTomorrow)); });
    }
    board.appendChild(colEl);
  });
  if (overflow.length > 0) {
    overflow.sort(bySortPriority(isTomorrow));
    var colEl2 = document.createElement('div');
    colEl2.className = 'board-col';
    colEl2.innerHTML = '<div class="board-col-header"><div><div class="board-col-title">Time TBD</div><div class="board-col-sub">No check-in time on file</div></div><span class="board-col-count">' + overflow.length + '</span></div>';
    overflow.forEach(function(rec, i) { colEl2.appendChild(buildCard(rec, i, isTomorrow)); });
    board.appendChild(colEl2);
  }
  return board;
}

// Feedback asks stay manual on purpose (see P3 note above -- this dashboard
// never writes to Airtable). This just copies the pre-written question to
// the clipboard, a read-only client-side action, so Amanda can paste it
// into Twilio herself.
function copyFeedbackQuestion(f) {
  var q = f['Feedback Question'] || '';
  if (!q) {
    showToast('No feedback question set for this experience yet');
    return;
  }
  try { navigator.clipboard.writeText(q); } catch (e) {}
  showToast('Feedback question copied — paste into Twilio');
}
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2800);
}
function tryLogin() {
  var val = document.getElementById('pw').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('sci', '1');
    sessionStorage.setItem('sciPw', val); // sent as a header so the API route isn't wide open
    init();
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}
document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});
document.getElementById('refresh-btn').addEventListener('click', loadExperiences);
if (sessionStorage.getItem('sci') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}
function init() {
  var now = new Date();
  document.getElementById('date-lbl').textContent = now.toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
  loadExperiences();
  setInterval(loadExperiences, 60000);
}
function atFetch(id, method, body) {
  var url = '/api/experiences' + (id ? ('?id=' + encodeURIComponent(id)) : '');
  var opts = {
    method: method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      'X-Dispatch-Key': sessionStorage.getItem('sciPw') || ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(function(r) {
    if (!r.ok) throw new Error('API ' + r.status);
    return r.json();
  });
}
// P4: the two intentional write actions. setHoldMode goes through
// api/hold.js rather than a plain Airtable PATCH -- switching Hold on also
// has to try cancelling any message P2's sweep already scheduled with
// Twilio (Eve-Of/Morning Message SID), or "Hold" wouldn't actually stop a
// queued morning message like the ticket requires. sendReply hits its own
// endpoint (api/reply.js) since it needs Twilio credentials too, which
// atFetch/api/experiences.js don't have.
function setHoldMode(id, hold) {
  return fetch('/api/hold', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Dispatch-Key': sessionStorage.getItem('sciPw') || ''
    },
    body: JSON.stringify({ recordId: id, hold: hold })
  }).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) throw new Error(data.error || ('API ' + r.status));
      return data;
    });
  });
}
function sendReply(recordId, to, body) {
  return fetch('/api/reply', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Dispatch-Key': sessionStorage.getItem('sciPw') || ''
    },
    body: JSON.stringify({ recordId: recordId, to: to, body: body })
  }).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) throw new Error(data.error || ('API ' + r.status));
      return data;
    });
  });
}
function wireAdminControls(card, rec) {
  var id = rec.id;
  var f = rec.fields;
  var phone = f['Mobile (from Mobile)'] || f['Phone'] || '';
  var isHold = isRecordHold(f);

  var holdBtn = card.querySelector('.btn-hold');
  if (holdBtn) {
    holdBtn.addEventListener('click', function() {
      holdBtn.disabled = true;
      holdBtn.textContent = 'Working…';
      setHoldMode(id, !isHold).then(function(data) {
        var msg;
        if (isHold) {
          msg = 'Resumed — automation picks up at the current step';
        } else {
          var cancellations = (data && data.cancellations) || [];
          var canceled = cancellations.filter(function(c) { return c.canceled; });
          var failed = cancellations.filter(function(c) { return !c.canceled; });
          if (canceled.length) {
            msg = 'On Hold — canceled ' + canceled.map(function(c) { return c.which; }).join(' & ') + ' message' + (canceled.length > 1 ? 's' : '') + ' with Twilio';
          } else if (failed.length) {
            msg = 'On Hold — could not cancel ' + failed.map(function(c) { return c.which; }).join(' & ') + ' (likely already sent)';
          } else {
            msg = 'On Hold — nothing queued with Twilio to cancel';
          }
        }
        showToast(msg);
        loadExperiences();
      }).catch(function(err) {
        showToast('Error: ' + err.message);
        holdBtn.disabled = false;
        holdBtn.textContent = isHold ? '▶ Resume' : '⏸ Hold';
      });
    });
  }

  var replyToggle = card.querySelector('.btn-reply-toggle');
  var replyBox = card.querySelector('.reply-box');
  if (replyToggle && replyBox) {
    replyToggle.addEventListener('click', function() {
      replyBox.style.display = replyBox.style.display === 'none' ? 'block' : 'none';
    });
  }
  var textarea = card.querySelector('.reply-input');
  var cancelBtn = card.querySelector('.btn-reply-cancel');
  if (cancelBtn && replyBox && textarea) {
    cancelBtn.addEventListener('click', function() {
      textarea.value = '';
      replyBox.style.display = 'none';
    });
  }
  var sendBtn = card.querySelector('.btn-reply-send');
  if (sendBtn && textarea) {
    sendBtn.addEventListener('click', function() {
      var text = textarea.value.trim();
      if (!text) { showToast('Type a message first'); return; }
      if (!phone) { showToast('No phone number on file for this experience'); return; }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      sendReply(id, phone, text).then(function() {
        showToast('Reply sent');
        loadExperiences();
      }).catch(function(err) {
        showToast('Error: ' + err.message);
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      });
    });
  }
}
function loadExperiences() {
  var container = document.getElementById('cards');
  container.innerHTML = '<div class="state-msg"><div class="ico">⏳</div>Loading...</div>';
  var today = new Date();
  var tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);
  atFetch().then(function(data) {
    var all = data.records || [];
    var todayRecs = all.filter(function(r) {
      return sameDay(parseIsoDate(r.fields['Check-In Date']), today);
    });
    var tomorrowRecs = all.filter(function(r) {
      return sameDay(parseIsoDate(r.fields['Check-In Date']), tomorrow);
    });
    if (todayRecs.length === 0 && tomorrowRecs.length === 0) {
      container.innerHTML = '<div class="state-msg"><div class="ico">✦</div>No experiences today or tomorrow.</div>';
      document.getElementById('exp-count').textContent = '';
      return;
    }
    var todayActive = todayRecs.filter(function(r) { return !isRecordComplete(r.fields); });
    var todayComplete = todayRecs.filter(function(r) { return isRecordComplete(r.fields); });
    document.getElementById('exp-count').textContent = todayActive.length + ' active' + (todayComplete.length ? ', ' + todayComplete.length + ' complete' : '');
    container.innerHTML = '';
    if (todayActive.length > 0) {
      var div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = 'Today';
      container.appendChild(div);
      container.appendChild(buildBoard(todayActive, false));
    }
    if (todayComplete.length > 0) {
      container.appendChild(buildCompleteSection(todayComplete));
    }
    if (tomorrowRecs.length > 0) {
      var div2 = document.createElement('div');
      div2.className = 'day-divider';
      div2.textContent = 'Tomorrow — eve-of & morning messages scheduled automatically';
      container.appendChild(div2);
      container.appendChild(buildBoard(tomorrowRecs, true));
    }
    document.getElementById('footer-note').textContent = 'Updated ' + new Date().toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }) + ' · Auto-refreshes every 60s · No URLs in messages';
  }).catch(function(err) {
    container.innerHTML = '<div class="state-msg"><div class="ico">⚠️</div>Could not load experiences.<br><small>' + err.message + '</small></div>';
  });
}
function buildCompleteSection(recs) {
  var wrap = document.createElement('div');
  wrap.className = 'complete-section';
  var toggle = document.createElement('div');
  toggle.className = 'complete-toggle';
  toggle.innerHTML = '<span class="chev">▸</span><span>' + recs.length + ' complete today</span>';
  var list = document.createElement('div');
  list.className = 'complete-list';
  recs.forEach(function(rec) { list.appendChild(buildCompactRow(rec)); });
  toggle.addEventListener('click', function() {
    var open = list.classList.toggle('expanded');
    toggle.classList.toggle('expanded', open);
  });
  wrap.appendChild(toggle);
  wrap.appendChild(list);
  return wrap;
}
function buildCompactRow(rec) {
  var f = rec.fields;
  var name = f['Customer Name'] || 'Unknown';
  var phone = f['Mobile (from Mobile)'] || f['Phone'] || '';
  var row = document.createElement('div');
  row.className = 'complete-row';
  row.innerHTML = '<div><div class="cname">' + esc(name) + '</div><div class="cmeta">' + phone + '</div></div><span class="badge done">Complete</span><button class="btn-feedback-sm">Send feedback ask</button>';
  var fbBtn = row.querySelector('.btn-feedback-sm');
  if (fbBtn) fbBtn.addEventListener('click', function(e) { e.stopPropagation(); copyFeedbackQuestion(f); });
  return row;
}
function buildCard(rec, idx, isTomorrow) {
  var f = rec.fields;
  var id = rec.id;
  var name = f['Customer Name'] || 'Unknown';
  var initials = String(name).split(' ').map(function(w) { return w[0] || ''; }).join('').slice(0,2).toUpperCase();
  var phone = f['Mobile (from Mobile)'] || f['Phone'] || '';
  var status = f['Status'] || 'New';
  var mode = f['Mode'] || 'Auto';
  var step = f['Current Step'] != null ? f['Current Step'] : 0;
  var nextMsg = f['Next Message'] || '';
  var lastReply = f['Last Reply'] || '';
  var lastSent = f['Last Sent At'] || '';
  var lastInbound = f['Last Inbound At'] || '';
  var lastManualReply = f['Last Manual Reply At'] || '';
  var scheduled = !!f['Scheduled'];
  var windowTag = windowTagText(getWindowKey(f));

  var totalMsgs = 0;
  for (var i = 1; i <= 15; i++) { if (f[messageField(i)]) totalMsgs = i; }

  var isComplete = status === 'Complete' || (step >= totalMsgs && totalMsgs > 0);
  var isWaiting = (status === 'New' || status === 'Ready' || status === 'Curating') && step === 0;
  var isHold = isRecordHold(f);
  var isStalled = isRecordStalled(f, isTomorrow);
  var minsIdle = minutesSince(latestActivityIso(f));

  var avatarCls = isHold ? 'hold' : isComplete ? 'complete' : isTomorrow ? 'tomorrow' : isWaiting ? 'waiting' : '';
  var badgeCls = isComplete ? 'done' : isTomorrow ? 'tmrw' : isWaiting ? 'wt' : 'ip';
  var badgeTxt = isComplete ? 'Complete' : isTomorrow ? 'Tomorrow' : isWaiting ? 'Waiting to start' : 'In progress';

  var pipCount = Math.max(totalMsgs, 5);
  var pipsHtml = '';
  for (var p = 0; p < pipCount; p++) {
    var cls = p < step ? 'sent' : p === step && !isComplete ? 'current' : '';
    pipsHtml += '<div class="pip ' + cls + '"></div>';
  }
  var stepLbl = isComplete ? 'All ' + totalMsgs + ' sent' : totalMsgs > 0 ? 'Step ' + (step + 1) + ' of ' + totalMsgs : 'Not started';

  var badges = '<span class="badge ' + badgeCls + '">' + badgeTxt + '</span>';
  if (isHold) badges += '<span class="badge hold">Hold</span>';
  if (isStalled) badges += '<span class="badge stall">⚠ Stalled ' + Math.floor(minsIdle) + 'm</span>';

  var card = document.createElement('div');
  card.className = 'card' + (isComplete ? ' complete-card' : '') + (isStalled ? ' stalled' : '');
  card.style.animationDelay = (idx * 0.05) + 's';
  card.id = 'card-' + id;

  // Last activity: what the customer last texted, and when -- or, if they
  // haven't replied yet, when we last sent something to them.
  var activityHtml = '';
  if (lastManualReply && lastManualReply > (lastInbound || '') && lastManualReply > (lastSent || '')) {
    activityHtml = '<div class="activity-row"><span class="activity-lbl">You replied</span><span class="activity-time">' + fmtTime(lastManualReply) + '</span></div>';
  } else if (lastReply) {
    activityHtml = '<div class="activity-row"><span class="activity-lbl">Last reply</span><span class="reply-bubble">' + esc(lastReply) + '</span>' + (lastInbound ? '<span class="activity-time">' + fmtTime(lastInbound) + '</span>' : '') + '</div>';
  } else if (lastSent) {
    activityHtml = '<div class="activity-row"><span class="activity-lbl">Sent, awaiting reply</span><span class="activity-time">' + fmtTime(lastSent) + '</span></div>';
  }

  var msgBlock = '';
  var msgIsLong = nextMsg && nextMsg.length > 140;
  if (isTomorrow) {
    msgBlock = '<div class="schedule-note">' + (scheduled ? '✓ Eve-of message scheduled for 8pm ET tonight' : 'Not yet scheduled — sweep runs nightly') + '</div>';
  } else if (nextMsg) {
    msgBlock = '<div class="msg-preview"><div class="msg-lbl">Next message</div><div class="msg-text">' + esc(nextMsg) + '</div>' + (msgIsLong ? '<span class="msg-toggle">Show more</span>' : '') + '</div>';
  }

  var nameBlock = '<div class="name-block"><div class="cname">' + esc(name) + '</div><div class="cmeta">' + phone + '</div>' + (windowTag ? '<div class="window-tag">' + esc(windowTag) + '</div>' : '') + '</div>';
  var cardTop = '<div class="card-top"><div class="avatar ' + (isComplete ? 'complete' : avatarCls) + '">' + initials + '</div>' + nameBlock + '</div>';
  var badgeRow = '<div class="badge-row">' + badges + '</div>';
  // P4: Hold toggle + reply box -- the only writes this dashboard makes,
  // and only Mode/Hold Notice Sent/Last Sent At, never Current Step or
  // message content. Not shown on Complete cards -- nothing left to manage.
  var adminHtml = '<div class="admin-row"><button class="btn-hold' + (isHold ? ' active' : '') + '">' + (isHold ? '▶ Resume' : '⏸ Hold') + '</button><button class="btn-reply-toggle">💬 Reply</button></div><div class="reply-box" style="display:none"><textarea class="reply-input" placeholder="Message this customer from the business number…"></textarea><div class="reply-actions"><button class="btn-reply-send">Send</button><button class="btn-reply-cancel">Cancel</button></div></div>';

  if (isComplete) {
    card.innerHTML = cardTop + badgeRow + '<div class="progress-row">' + pipsHtml + '<span class="pip-lbl">' + stepLbl + '</span></div>' + activityHtml + '<div class="actions"><button class="btn-feedback">Send feedback ask</button></div>';
  } else {
    card.innerHTML = cardTop + badgeRow + '<div class="progress-row">' + pipsHtml + '<span class="pip-lbl">' + stepLbl + '</span></div>' + activityHtml + msgBlock + adminHtml;
  }
  var fbBtn = card.querySelector('.btn-feedback');
  if (fbBtn) fbBtn.addEventListener('click', function() { copyFeedbackQuestion(f); });
  var msgToggle = card.querySelector('.msg-toggle');
  if (msgToggle) {
    msgToggle.addEventListener('click', function() {
      var textEl = card.querySelector('.msg-text');
      var isExp = textEl.classList.toggle('expanded');
      msgToggle.textContent = isExp ? 'Show less' : 'Show more';
    });
  }
  if (!isComplete) wireAdminControls(card, rec);
  return card;
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
</script>
