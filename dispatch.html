<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Check-In · Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --parchment: #F8F0E3;
  --dark: #2C2820;
  --slate: #6B7B8D;
  --greige: #787362;
  --border: rgba(44,40,32,0.12);
  --border-strong: rgba(44,40,32,0.22);
  --success: #4A7C59;
  --success-bg: #EAF2ED;
  --warning-bg: #FDF6E3;
  --warning: #8A6800;
  --info-bg: #EDF2F7;
  --info: #2C5282;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(44,40,32,0.08), 0 4px 16px rgba(44,40,32,0.06);
}
body { font-family: 'DM Sans', sans-serif; background: var(--parchment); color: var(--dark); min-height: 100vh; font-size: 14px; line-height: 1.6; }
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; width: 320px; box-shadow: var(--shadow); }
.wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 22px; letter-spacing: 0.04em; color: var(--dark); margin-bottom: 6px; }
.sub { font-size: 12px; color: var(--greige); margin-bottom: 28px; }
input[type=password] { width: 100%; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--dark); background: var(--parchment); margin-bottom: 12px; outline: none; }
input[type=password]:focus { border-color: var(--slate); }
.err { font-size: 12px; color: #c0392b; margin-bottom: 8px; display: none; }
.btn-primary { width: 100%; padding: 10px; background: var(--dark); color: var(--parchment); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-primary:hover { opacity: 0.85; }
#app { display: none; }
.topbar { background: white; border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 20px; letter-spacing: 0.04em; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.date-lbl { font-size: 13px; color: var(--greige); }
.refresh-btn { font-size: 12px; color: var(--slate); background: none; border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.refresh-btn:hover { background: var(--border); }
.main { max-width: 680px; margin: 0 auto; padding: 32px 24px 80px; }
.section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
.section-title { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 20px; }
.section-count { font-size: 12px; color: var(--greige); }
.day-divider { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--greige); margin: 24px 0 10px; }
.card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 12px; box-shadow: var(--shadow); animation: fadeUp 0.3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; background: var(--info-bg); color: var(--info); }
.avatar.complete { background: var(--success-bg); color: var(--success); }
.avatar.waiting { background: var(--warning-bg); color: var(--warning); }
.avatar.tomorrow { background: var(--parchment); color: var(--greige); border: 1px solid var(--border-strong); }
.cname { font-size: 15px; font-weight: 500; }
.cmeta { font-size: 12px; color: var(--greige); margin-top: 1px; }
.badge { margin-left: auto; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
.badge.ip { background: var(--info-bg); color: var(--info); }
.badge.wt { background: var(--warning-bg); color: var(--warning); }
.badge.done { background: var(--success-bg); color: var(--success); }
.badge.tmrw { background: var(--parchment); color: var(--greige); border: 1px solid var(--border-strong); }
.progress-row { display: flex; align-items: center; gap: 5px; margin-bottom: 14px; }
.pip { height: 5px; border-radius: 3px; background: var(--border); flex: 1; max-width: 32px; }
.pip.sent { background: var(--slate); opacity: 0.5; }
.pip.current { background: var(--slate); }
.pip-lbl { font-size: 12px; color: var(--greige); margin-left: 6px; white-space: nowrap; flex-shrink: 0; }
.reply-bubble { display: inline-block; background: var(--parchment); border: 1px solid var(--border-strong); border-radius: 10px 10px 2px 10px; padding: 4px 10px; font-size: 12px; margin-bottom: 10px; }
.msg-preview { background: var(--parchment); border-left: 2px solid var(--slate); border-radius: 0 6px 6px 0; padding: 12px 14px; margin-bottom: 14px; }
.msg-lbl { font-size: 10px; letter-spacing: 0.08em; color: var(--greige); text-transform: uppercase; margin-bottom: 6px; }
.msg-text { font-size: 13px; line-height: 1.6; }
.actions { display: flex; align-items: center; gap: 8px; }
.btn-send { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--dark); color: var(--parchment); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-send:hover { opacity: 0.82; }
.btn-send:disabled { opacity: 0.35; cursor: default; }
.btn-ghost { padding: 8px 14px; background: transparent; border: 1px solid var(--border-strong); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--greige); cursor: pointer; }
.btn-ghost:hover { background: var(--parchment); }
.reply-note { margin-left: auto; font-size: 11px; color: var(--greige); }
.btn-feedback { padding: 8px 16px; background: var(--success-bg); color: var(--success); border: 1px solid rgba(74,124,89,0.3); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.state-msg { text-align: center; padding: 60px 24px; color: var(--greige); }
.state-msg .ico { font-size: 32px; margin-bottom: 12px; }
.footer-note { text-align: center; font-size: 11px; color: var(--greige); margin-top: 40px; opacity: 0.7; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: var(--parchment); padding: 10px 20px; border-radius: 8px; font-size: 13px; transition: transform 0.25s ease; z-index: 999; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="wordmark">Self Check-In</div>
    <div class="sub">Dispatch · Operations</div>
    <input type="password" id="pw" placeholder="Password">
    <div class="err" id="pw-err">Incorrect password</div>
    <button class="btn-primary" id="login-btn">Enter</button>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-wordmark">Self Check-In</div>
    <div class="topbar-right">
      <span class="date-lbl" id="date-lbl"></span>
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    </div>
  </div>
  <div class="main">
    <div class="section-header">
      <span class="section-title">Today's experiences</span>
      <span class="section-count" id="exp-count"></span>
    </div>
    <div id="cards"></div>
    <div class="footer-note" id="footer-note"></div>
  </div>
</div>
<div id="toast"></div>
<script>
// NOTE: No Airtable token lives here anymore. The client only ever talks to
// our own /api/experiences proxy, which holds the real Airtable token
// server-side (see api/experiences.js + Vercel Environment Variables).
var PASSWORD = 'selfcheckin2026'; // change this and DISPATCH_PASSWORD env var together if you want to rotate it

// Parses dates in ISO (YYYY-MM-DD), numeric D/M/Y or M/D/Y, and text
// formats like "Sat. July 11th" -- replaces the old exact-string match
// that silently dropped any record not in perfect zero-padded DD/MM/YYYY.
function parseFlexibleDate(input) {
  if (!input) return null;
  if (Array.isArray(input)) input = input[0];
  input = String(input).trim();
  if (!input) return null;

  var iso = input.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));

  var numeric = input.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (numeric) {
    var a = Number(numeric[1]), b = Number(numeric[2]), y = Number(numeric[3]);
    var day, month;
    if (a > 12) { day = a; month = b; }
    else if (b > 12) { day = b; month = a; }
    else { day = a; month = b; } // default assumption: DD/MM, matches original convention
    return new Date(y, month - 1, day);
  }

  var monthNames = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  var lower = input.toLowerCase();
  for (var m = 0; m < monthNames.length; m++) {
    if (lower.indexOf(monthNames[m]) !== -1) {
      var dayMatch = lower.match(/(\d{1,2})/);
      if (dayMatch) {
        var yearMatch = lower.match(/(\d{4})/);
        var year = yearMatch ? Number(yearMatch[1]) : new Date().getFullYear();
        return new Date(year, m, Number(dayMatch[1]));
      }
    }
  }
  return null;
}
function sameDay(d1, d2) {
  return !!d1 && !!d2 && d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2800);
}
function tryLogin() {
  var val = document.getElementById('pw').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('sci', '1');
    sessionStorage.setItem('sciPw', val); // sent as a header so the API route isn't wide open
    init();
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}
document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});
document.getElementById('refresh-btn').addEventListener('click', loadExperiences);
if (sessionStorage.getItem('sci') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}
function init() {
  var now = new Date();
  document.getElementById('date-lbl').textContent = now.toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
  loadExperiences();
  setInterval(loadExperiences, 60000);
}
function atFetch(id, method, body) {
  var url = '/api/experiences' + (id ? ('?id=' + encodeURIComponent(id)) : '');
  var opts = {
    method: method || 'GET',
    headers: {
      'Content-Type': 'application/json',
      'X-Dispatch-Key': sessionStorage.getItem('sciPw') || ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(function(r) {
    if (!r.ok) throw new Error('API ' + r.status);
    return r.json();
  });
}
function loadExperiences() {
  var container = document.getElementById('cards');
  container.innerHTML = '<div class="state-msg"><div class="ico">⏳</div>Loading...</div>';
  var today = new Date();
  var tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);
  atFetch().then(function(data) {
    var all = data.records || [];
    var todayRecs = all.filter(function(r) {
      return sameDay(parseFlexibleDate(r.fields['Experience Date']), today);
    });
    var tomorrowRecs = all.filter(function(r) {
      return sameDay(parseFlexibleDate(r.fields['Experience Date']), tomorrow);
    });
    if (todayRecs.length === 0 && tomorrowRecs.length === 0) {
      container.innerHTML = '<div class="state-msg"><div class="ico">✦</div>No experiences today or tomorrow.</div>';
      document.getElementById('exp-count').textContent = '';
      return;
    }
    var total = todayRecs.length + tomorrowRecs.length;
    document.getElementById('exp-count').textContent = total + ' active';
    container.innerHTML = '';
    var order = { 'In progress': 0, 'Ready': 1, 'New': 1, 'Curating': 2, 'Complete': 3 };
    if (todayRecs.length > 0) {
      var div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = 'Today';
      container.appendChild(div);
      todayRecs.sort(function(a,b) { return (order[a.fields['Status']]||2)-(order[b.fields['Status']]||2); });
      todayRecs.forEach(function(rec, i) { container.appendChild(buildCard(rec, i, false)); });
    }
    if (tomorrowRecs.length > 0) {
      var div2 = document.createElement('div');
      div2.className = 'day-divider';
      div2.textContent = 'Experience tomorrow — send eve-of message tonight';
      container.appendChild(div2);
      tomorrowRecs.sort(function(a,b) { return (order[a.fields['Status']]||2)-(order[b.fields['Status']]||2); });
      tomorrowRecs.forEach(function(rec, i) { container.appendChild(buildCard(rec, i, true)); });
    }
    document.getElementById('footer-note').textContent = 'Updated ' + new Date().toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }) + ' · Auto-refreshes every 60s · No URLs in messages';
  }).catch(function(err) {
    container.innerHTML = '<div class="state-msg"><div class="ico">⚠️</div>Could not load experiences.<br><small>' + err.message + '</small></div>';
  });
}
function buildCard(rec, idx, isTomorrow) {
  var f = rec.fields;
  var id = rec.id;
  var name = f['Customer Name'] || 'Unknown';
  var initials = String(name).split(' ').map(function(w) { return w[0] || ''; }).join('').slice(0,2).toUpperCase();
  var phone = f['Mobile (from Mobile)'] || f['Phone'] || '';
  var status = f['Status'] || 'New';
  var step = f['Current Step'] != null ? f['Current Step'] : 0;
  var nextMsg = f['Next Message'] || '';
  var lastReply = f['Last Reply'] || '';
  var lastSent = f['Last Sent At'] || '';
  var totalMsgs = 0;
  for (var i = 1; i <= 11; i++) { if (f['Message ' + i]) totalMsgs = i; }
  var isComplete = status === 'Complete' || (step >= totalMsgs && totalMsgs > 0);
  var isWaiting = (status === 'New' || status === 'Ready' || status === 'Curating') && step === 0;
  var avatarCls = isComplete ? 'complete' : isTomorrow ? 'tomorrow' : isWaiting ? 'waiting' : '';
  var badgeCls = isComplete ? 'done' : isTomorrow ? 'tmrw' : isWaiting ? 'wt' : 'ip';
  var badgeTxt = isComplete ? 'Complete' : isTomorrow ? 'Tomorrow' : isWaiting ? 'Waiting to start' : 'In progress';
  var pipCount = Math.max(totalMsgs, 5);
  var pipsHtml = '';
  for (var p = 0; p < pipCount; p++) {
    var cls = p < step ? 'sent' : p === step && !isComplete ? 'current' : '';
    pipsHtml += '<div class="pip ' + cls + '"></div>';
  }
  var stepLbl = isComplete ? 'All ' + totalMsgs + ' sent' : totalMsgs > 0 ? 'Step ' + (step + 1) + ' of ' + totalMsgs : 'Not started';
  var msgLbl = isTomorrow ? 'Eve-of message' : step === 0 ? 'Opening message' : step === 1 ? 'Morning message' : 'Next message — stop ' + (step - 1);
  var sendLbl = isTomorrow && step === 0 ? 'Send eve-of message' : step === 0 ? 'Send welcome' : step === 1 ? 'Send morning message' : 'Send stop ' + (step - 1);
  var card = document.createElement('div');
  card.className = 'card' + (isComplete ? ' complete-card' : '');
  card.style.animationDelay = (idx * 0.05) + 's';
  card.id = 'card-' + id;
  var replyBubble = lastReply ? '<div class="reply-bubble">' + esc(lastReply) + ' ✓</div>' : '';
  var replyNote = lastReply ? '<span class="reply-note">replied "' + esc(lastReply) + '"</span>' : (lastSent && !isTomorrow && step > 1) ? '<span class="reply-note">sent · awaiting reply</span>' : '';
  var msgBlock = nextMsg ? '<div class="msg-preview"><div class="msg-lbl">' + msgLbl + '</div><div class="msg-text">' + esc(nextMsg) + '</div></div>' : '';
  if (isComplete) {
    card.innerHTML = '<div class="card-top"><div class="avatar complete">' + initials + '</div><div><div class="cname">' + esc(name) + '</div><div class="cmeta">' + phone + '</div></div><span class="badge done">Complete</span></div><div class="progress-row">' + pipsHtml + '<span class="pip-lbl">' + stepLbl + '</span></div><div class="actions"><button class="btn-feedback">Send feedback ask</button></div>';
  } else {
    card.innerHTML = '<div class="card-top"><div class="avatar ' + avatarCls + '">' + initials + '</div><div><div class="cname">' + esc(name) + '</div><div class="cmeta">' + phone + '</div></div><span class="badge ' + badgeCls + '">' + badgeTxt + '</span></div><div class="progress-row">' + pipsHtml + '<span class="pip-lbl">' + stepLbl + '</span></div>' + replyBubble + msgBlock + '<div class="actions"><button class="btn-send" id="sbtn-' + id + '">↑ ' + sendLbl + '</button>' + replyNote + '</div>';
  }
  var sendBtn = card.querySelector('.btn-send');
  if (sendBtn) sendBtn.addEventListener('click', function() { copyAndAdvance(id, isTomorrow); });
  var fbBtn = card.querySelector('.btn-feedback');
  if (fbBtn) fbBtn.addEventListener('click', function() { showToast('Feedback message — send manually via Twilio'); });
  return card;
}
function copyAndAdvance(recordId, isTomorrow) {
  var btn = document.getElementById('sbtn-' + recordId);
  if (btn) { btn.disabled = true; btn.textContent = 'Working...'; }
  atFetch(recordId).then(function(rec) {
    var f = rec.fields;
    var nextMsg = f['Next Message'] || '';
    var step = f['Current Step'] != null ? f['Current Step'] : 0;
    if (nextMsg) { try { navigator.clipboard.writeText(nextMsg); } catch(e) {} }
    if (isTomorrow) {
      showToast('Eve-of message copied — paste into Twilio');
      if (btn) { btn.disabled = false; btn.textContent = '↑ Send eve-of message'; }
      return Promise.resolve();
    }
    return atFetch(recordId, 'PATCH', { fields: { 'Current Step': step + 1, 'Last Sent At': new Date().toISOString() } });
  }).then(function() {
    if (!isTomorrow) {
      showToast('Copied to clipboard · Step advanced');
      setTimeout(loadExperiences, 800);
    }
  }).catch(function(err) {
    showToast('Error: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Retry'; }
  });
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
</script>
</body>
</html>
